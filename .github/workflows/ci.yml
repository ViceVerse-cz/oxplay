name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            name: macOS ARM64 build and tests
          - runner: ubuntu-24.04
            name: Linux X11 + Wayland build and tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select checked-in Rust toolchain
        run: |
          rustup show
          rustc --version --verbose
          cargo --version

      - name: Select Python for packaging and audit tools
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          test "$(uname -m)" = arm64
          brew install mpv pkgconf
          pkg-config --atleast-version=2.5 mpv
          brew list --versions > "$RUNNER_TEMP/native-packages.txt"
          pkg-config --modversion mpv

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl pkg-config meson ninja-build \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev libplacebo-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxss-dev \
            libxext-dev libxpresent-dev libxrandr-dev libxi-dev libxcursor-dev \
            libasound2-dev libpulse-dev libfontconfig1-dev
          dpkg-query -W -f='${Package}=${Version}\n' | LC_ALL=C sort > "$RUNNER_TEMP/native-packages.txt"

      - name: Identify actual native dependency versions
        id: native
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          inventory = Path(os.environ['RUNNER_TEMP']) / 'native-packages.txt'
          print(inventory.read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('hash=' + hashlib.sha256(inventory.read_bytes()).hexdigest(), file=output)
          PY

      - name: Cache exact Linux libmpv build
        if: runner.os == 'Linux'
        id: mpv-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/serein-mpv-0.41.0
          key: libmpv-${{ runner.os }}-${{ runner.arch }}-0.41.0-${{ hashFiles('scripts/ci/install-mpv-linux.sh') }}-${{ steps.native.outputs.hash }}
          # No partial restore: the installed native ABI must match this inventory.

      - name: Build verified Linux libmpv source
        if: runner.os == 'Linux' && steps.mpv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: bash scripts/ci/install-mpv-linux.sh "$RUNNER_TEMP/serein-mpv-0.41.0"

      - name: Select isolated Linux libmpv
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/serein-mpv-0.41.0/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/serein-mpv-0.41.0/lib" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$RUNNER_TEMP/serein-mpv-0.41.0/lib/pkgconfig" pkg-config --atleast-version=2.5 mpv
          PKG_CONFIG_PATH="$RUNNER_TEMP/serein-mpv-0.41.0/lib/pkgconfig" pkg-config --modversion mpv
          sha256sum "$RUNNER_TEMP/serein-mpv-0.41.0/lib/libmpv.so.2"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: production-${{ matrix.runner }}-${{ steps.native.outputs.hash }}-${{ hashFiles('scripts/ci/install-mpv-linux.sh') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint locked production features
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run automated Rust tests
        # Ignored human-account, network integration and Keychain probes stay ignored.
        # Native media unit tests use null audio/video outputs, not a display session.
        run: cargo test --workspace --locked

      - name: Test packaging and source-audit tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build locked production workspace
        run: cargo build --workspace --release --locked

      - name: State qualification scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job checks the locked production feature set, automated tests and release compilation.
          It does not qualify native X11/Wayland/macOS presentation, hardware decoding,
          accessibility, accounts, resource budgets or a portable distribution bundle.
          EOF
