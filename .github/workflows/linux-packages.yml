name: Linux packages

on:
  pull_request:
    paths:
      - 'packaging/linux/**'
      - 'packaging/appimage/**'
      - 'packaging/repositories/**'
      - 'packaging/notices.py'
      - 'packaging/licenses/**'
      - 'scripts/fetch_pinned.py'
      - 'scripts/ci/install-mpv-linux.sh'
      - 'scripts/native-media/**'
      - 'crates/media/src/native_vulkan.rs'
      - '.github/workflows/linux-packages.yml'
      - '.github/workflows/package-repositories.yml'
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      tag:
        type: string
        default: development
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'

jobs:
  ubuntu:
    # Every format ships caller-owned Vulkan ABI 1; stock libmpv is incompatible.
    name: Ubuntu 24.04 native Vulkan deb, AppImage and tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag || 'development' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.release == true
        with:
          name: release-manifests
          path: .
      - name: Install native build and packaging tools
        run: |
          bash packaging/linux/install-build-deps.sh
          dpkg-query -W -f='${Package}=${Version}\n' | LC_ALL=C sort > "$RUNNER_TEMP/native-packages.txt"
      - name: Identify actual native dependency versions
        id: native
        run: echo "hash=$(sha256sum "$RUNNER_TEMP/native-packages.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build pinned native media, verify C ABI and client loading
        timeout-minutes: 60
        run: |
          python3 scripts/native-media/linux.py --build-ffmpeg --jobs 2 \
            --prefix "$RUNNER_TEMP/oxplay-native-linux" --work-dir "$RUNNER_TEMP/oxplay-native-linux-work"
          echo "OXPLAY_NATIVE_MPV_PREFIX=$RUNNER_TEMP/oxplay-native-linux" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/oxplay-native-linux/lib" >> "$GITHUB_ENV"
      - name: Select checked-in Rust toolchain
        run: |
          rustup show
          rustc --version --verbose
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-package-native-ubuntu-${{ steps.native.outputs.hash }}-${{ hashFiles('scripts/native-media/**') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build locked default-native release binary
        run: cargo build --release --locked -p oxplay
      - name: Packaging regression (offline)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*packag*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/linux -p 'test_native_media.py'
      - name: Fetch pinned helpers and AppImage tools
        run: |
          python3 scripts/fetch_pinned.py yt-dlp-linux-x86_64 deno-linux-x86_64 appimagetool-x86_64 \
            appimage-runtime-x86_64 --dest target/pinned
          target/pinned/yt-dlp --version
          target/pinned/deno --version
      - name: Build and inspect the Debian package
        run: |
          python3 packaging/linux/package.py deb --helpers target/pinned \
            --mpv-prefix "$OXPLAY_NATIVE_MPV_PREFIX" --output dist
      - name: Build and inspect the AppImage and portable tarball
        run: |
          python3 packaging/appimage/build.py --helpers target/pinned \
            --mpv-prefix "$OXPLAY_NATIVE_MPV_PREFIX" --tag "$TAG" --output dist
      - name: Signed apt repository regression (synthetic key)
        run: |
          python3 -m unittest discover -s scripts -p 'test_package_repositories.py'
          sudo sh packaging/repositories/smoke-deb.sh
      - name: Collect distribution-labelled packages
        run: |
          mkdir release-assets
          for package in dist/*.deb; do
            # GitHub replaces ~ in asset names; normalize before checksums.
            cp "$package" "release-assets/oxplay-$TAG-Linux-ubuntu-24.04-$(basename "$package" | tr '~' '.')"
          done
          cp dist/oxplay-*-Linux-X64.AppImage dist/oxplay-*-Linux-X64.AppImage.zsync dist/oxplay-*-Linux-X64.tar.gz release-assets/
          ls -l release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxplay-linux-ubuntu-24.04
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-media-linux-ubuntu-evidence
          path: |
            ${{ runner.temp }}/oxplay-native-linux/native-media-*.json
            ${{ runner.temp }}/oxplay-native-linux/share/oxplay-native/host-packages.txt
            ${{ runner.temp }}/oxplay-native-linux-work/*/build/meson-logs/
          if-no-files-found: warn
          retention-days: 14

  native:
    # Native media is bundled privately even on distributions offering stock mpv.
    name: ${{ matrix.distribution }} native Vulkan ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: fedora-44
            image: fedora:44
            format: rpm
          - distribution: arch
            image: archlinux:base
            format: arch
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.release == true
        with:
          name: release-manifests
          path: .
      - name: Install native source build and packaging tools
        run: sh packaging/linux/install-build-deps.sh
      - name: Create unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build, package and inspect
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          runuser -u builder -- env HOME=/home/builder FORMAT="$FORMAT" CARGO_TERM_COLOR=always CARGO_BUILD_JOBS=2 bash <<'BUILD'
            set -eu
            python3 scripts/fetch_pinned.py rustup-init-linux-x86_64 yt-dlp-linux-x86_64 deno-linux-x86_64 --dest target/pinned
            target/pinned/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup toolchain install
            rustc --version --verbose
            export OXPLAY_NATIVE_MPV_PREFIX="$GITHUB_WORKSPACE/target/native-media-prefix"
            python3 scripts/native-media/linux.py --build-ffmpeg --jobs 2 \
              --prefix "$OXPLAY_NATIVE_MPV_PREFIX" --work-dir "$GITHUB_WORKSPACE/target/native-media-work"
            export LD_LIBRARY_PATH="$OXPLAY_NATIVE_MPV_PREFIX/lib"
            cargo build --release --locked -p oxplay
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_release_packaging.py'
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/linux -p 'test_native_media.py'
            python3 packaging/linux/package.py "$FORMAT" --helpers target/pinned \
              --mpv-prefix "$OXPLAY_NATIVE_MPV_PREFIX" --output dist
          BUILD
      - name: Collect distribution-labelled package
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          TAG: ${{ inputs.tag || 'development' }}
        run: |
          mkdir release-assets
          for package in dist/*.rpm dist/*.pkg.tar.zst; do
            test -f "$package" || continue
            cp "$package" "release-assets/oxplay-$TAG-Linux-$DISTRIBUTION-$(basename "$package" | tr '~' '.')"
          done
          ls -l release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxplay-linux-${{ matrix.distribution }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-media-linux-${{ matrix.distribution }}-evidence
          path: |
            target/native-media-prefix/native-media-*.json
            target/native-media-prefix/share/oxplay-native/host-packages.txt
            target/native-media-work/*/build/meson-logs/
          if-no-files-found: warn
          retention-days: 14
