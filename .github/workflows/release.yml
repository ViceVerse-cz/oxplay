name: Release (manual)
run-name: Preview ${{ inputs.tag || 'next dev tag' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag matching Cargo.toml (for example v0.1.0-dev.2); empty picks the next unused v<version>-dev.N
        type: string
        required: false
        default: ''
      publish:
        description: Publish the prerelease immediately instead of leaving a draft
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.archive.outputs.revision }}
      tag: ${{ steps.archive.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
      - name: Archive the exact source revision
        id: archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_source.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"} \
            --output release-assets --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-preview
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  checks:
    needs: source
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS ARM64 app bundle
    needs: source
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ needs.source.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install native dependencies and bundled helper runtime
        env:
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          test "$(uname -m)" = arm64
          # Runner images ship a stale formula index; the reviewed helper
          # dependency set needs the current yt-dlp formula revision.
          brew update
          brew install mpv pkgconf yt-dlp
          pkg-config --atleast-version=2.5 mpv
          test -x /opt/homebrew/bin/yt-dlp
          test -x /opt/homebrew/bin/deno
          brew list --versions mpv yt-dlp deno
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos
          save-if: false
          cache-on-failure: true
      - name: Build and inspect the bundle
        run: |
          mkdir dist release-assets
          python3 scripts/package_macos.py bundle --build --bundle-helpers --output dist/Serein.app
          python3 scripts/verify_package.py dist/Serein.app
      - name: Archive the bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Serein.app "release-assets/serein-$TAG-macOS-ARM64.zip"
          cp dist/Serein.app.inventory.json "release-assets/serein-$TAG-macOS-ARM64.inventory.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64 tarball
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ needs.source.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl pkg-config meson ninja-build \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev libplacebo-dev libluajit-5.1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxss-dev \
            libxext-dev libxpresent-dev libxrandr-dev libxi-dev libxcursor-dev \
            libasound2-dev libpulse-dev libfontconfig1-dev
          dpkg-query -W -f='${Package}=${Version}\n' | LC_ALL=C sort > "$RUNNER_TEMP/native-packages.txt"
      - name: Identify actual native dependency versions
        id: native
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          inventory = Path(os.environ['RUNNER_TEMP']) / 'native-packages.txt'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('hash=' + hashlib.sha256(inventory.read_bytes()).hexdigest(), file=output)
          PY
      # Same key as CI so a warm CI run also warms this cache.
      - name: Cache exact Linux libmpv build
        id: mpv-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/serein-mpv-0.41.0
          key: libmpv-${{ runner.os }}-${{ runner.arch }}-0.41.0-${{ hashFiles('scripts/ci/install-mpv-linux.sh') }}-${{ steps.native.outputs.hash }}
      - name: Build verified Linux libmpv source
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: bash scripts/ci/install-mpv-linux.sh "$RUNNER_TEMP/serein-mpv-0.41.0"
      - name: Select isolated Linux libmpv
        run: |
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/serein-mpv-0.41.0/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/serein-mpv-0.41.0/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ steps.native.outputs.hash }}
          save-if: false
          cache-on-failure: true
      - name: Build locked release binary
        run: |
          rustc --version --verbose
          cargo build --release --locked -p serein
      - name: Package tarball
        run: bash scripts/ci/package-linux.sh "$TAG" "$RUNNER_TEMP/serein-mpv-0.41.0" release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [source, checks, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-preview
          path: release-assets
      - name: Verify source assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          path: release-assets
          merge-multiple: true
      - name: Checksum every asset
        working-directory: release-assets
        run: |
          rm SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create immutable tag and prerelease
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          # Fail on an existing tag instead of moving or overwriting it.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT"
          state=--draft
          [ "$PUBLISH" = true ] && state=
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --target "$RELEASE_COMMIT" \
            --title "Serein $RELEASE_TAG" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --prerelease --latest=false $state
