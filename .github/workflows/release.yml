name: Promote validated native v0.1.0 (one time)
run-name: Promote v0.1.0 from validated run 36839089100 by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Only production is accepted by this one-time promoter
        type: choice
        options: [nightly, production]
        default: production
        required: true
      dry_run:
        description: Must be false; source build validation already ran separately
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: oxplay-release-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PROMOTE_CHANNEL: ${{ inputs.channel }}
      PROMOTE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Refuse unsupported dispatch inputs
        run: |
          test "$PROMOTE_CHANNEL" = production
          test "$PROMOTE_DRY_RUN" = false
      - name: Check out isolated promoter controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - name: Check out exact validated application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 360eda2b7dd871791742fdaf8302b3c26f29dc9b
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install archive readers (payloads are never executed or extracted)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zstd
      - name: Test promoter refusal and verification contracts offline
        run: python3 -m unittest discover -s controls/scripts -p test_promote_validated_release.py
      - name: Validate completed build run, mandatory gates and exact resume commit
        run: python3 controls/scripts/promote_validated_release.py validate --source source --evidence controls/target/promotion-evidence
      - name: Download the exact existing binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '36839089100'
          pattern: oxplay-*
          merge-multiple: true
          path: source/release-assets
      - name: Download source run's assembled preview checksum evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '36839089100'
          name: release-preview
          path: source/preview
      - name: Reverify payload and resume exact existing release commit publication
        env:
          MACOS_SIGNED: 'false'
        run: python3 controls/scripts/promote_validated_release.py promote --source source --evidence controls/target/promotion-evidence
      - name: Retain internal promotion verification and source metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.1.0-promotion-verification-${{ github.run_id }}
          path: controls/target/promotion-evidence/
          if-no-files-found: warn
          retention-days: 30
