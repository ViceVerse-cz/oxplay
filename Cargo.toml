[workspace]
members = ["crates/app", "crates/core", "crates/youtube", "crates/media", "crates/storage", "crates/network"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-femtovg-wgpu", "accessibility", "unstable-winit-030", "unstable-wgpu-30"] }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", default-features = false, features = ["compat-1-18"] }
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
# Published 0.27.0 source plus a bounded WGPU pipeline-cache correction.
# See vendor/femtovg/OXPLAY-PROVENANCE.md for the original archive checksum.
femtovg = { path = "vendor/femtovg" }
# Exact 30.0.1 archive with a Metal-only identical-PRESENT ordering correction.
# See vendor/wgpu-hal/OXPLAY-PROVENANCE.md for checksum and semantic scope.
wgpu-hal = { path = "vendor/wgpu-hal" }

[patch."https://github.com/slint-ui/slint"]
# Same pinned package, with the guarded single-image rounded clip optimization.
# See vendor/slint-femtovg/OXPLAY-PROVENANCE.md for source and license records.
i-slint-renderer-femtovg = { path = "vendor/slint-femtovg" }
