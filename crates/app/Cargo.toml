[package]
name = "oxplay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slint.workspace = true
oxplay-core = { path = "../core" }
oxplay-youtube = { path = "../youtube" }
oxplay-media = { path = "../media" }
oxplay-network = { path = "../network" }
oxplay-storage = { path = "../storage" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
zeroize = "1.9"
webbrowser = "1.2.4"
ring = "0.17"
# Downloads manifest (downloads.rs); already locked through oxplay-storage.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSButton", "NSControl", "NSGraphics", "NSVisualEffectView"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
# Explicit card-menu clipboard writes (text and thumbnail pixels). Already locked
# through the pinned Slint Winit backend; this edge only adds image-data.
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
