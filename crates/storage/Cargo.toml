[package]
name = "oxplay-storage"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
oxplay-core = { path = "../core" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"] }
zeroize = "1.9"
getrandom = "0.4"
tempfile = "3.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
