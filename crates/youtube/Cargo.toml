[package]
name = "oxplay-youtube"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
oxplay-core = { path = "../core" }
serde_json = "1"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
sha1 = "0.10"
zeroize = "1"
httpdate = "1"
# Browser-session sign-in (macOS): read only YouTube/Google cookies from an
# installed browser profile and decrypt Chromium values locally.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
