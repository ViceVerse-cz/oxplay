[package]
name = "i-slint-renderer-femtovg"
description = "FemtoVG based renderer for Slint"
authors = ["Slint Developers <info@slint.dev>"]
edition = "2024"
homepage = "https://slint.dev"
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
repository = "https://github.com/slint-ui/slint"
rust-version = "1.95"
version = "1.19.0"

[lib]
path = "lib.rs"

[features]
image-pixel-format-gray8 = ["i-slint-core/image-pixel-format-gray8"]
image-pixel-format-rgb565 = ["i-slint-core/image-pixel-format-rgb565"]
default = []
opengl = []
# wgpu-30 enables the wgpu backend for internal use (e.g. linuxkms DRM rendering).
# unstable-wgpu-30 additionally exposes public API integration (GraphicsAPI, texture import).
wgpu = ["wgpu-30"]
wgpu-30 = ["dep:wgpu-30", "femtovg/wgpu", "i-slint-core/wgpu-30"]
unstable-wgpu-30 = ["wgpu-30", "i-slint-core/unstable-wgpu-30"]

[dependencies]
i-slint-core = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", version = "=1.19.0", default-features = false, features = ["default", "box-shadow-cache", "shared-fontique", "shared-parley"] }
i-slint-core-macros = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", version = "=1.19.0", default-features = false, features = ["default"] }
i-slint-common = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", version = "=1.19.0", default-features = false, features = ["default", "shared-fontique"] }

const-field-offset = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", version = "0.2.1" }

lyon_path = { version = "1.0", default-features = false }
pin-weak = "1"
femtovg = { version = "0.27", default-features = false, features = ["swash"] }
imgref = { version = "1.6.1" }
rgb = { version = "0.8.27" }

glow = { version = "0.18" }

wgpu-30 = { package = "wgpu", version = "30", optional = true, default-features = true }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
web-sys = { version = "0.3.72", default-features = false, features = ["console", "WebGlContextAttributes", "CanvasRenderingContext2d", "HtmlInputElement", "HtmlCanvasElement", "Window", "Document"] }
wasm-bindgen = { version = "0.2" }
# Enable wgpu-core's WebGL2 backend so the wgpu init helper can fall back to
# it transparently when no BROWSER_WEBGPU adapter is available (e.g. in
# headless Chromium without a usable WebGPU device).
wgpu-30 = { package = "wgpu", version = "30", optional = true, default-features = false, features = ["webgl"] }

# The browser decodes images on the web; decode with the image and resvg crates elsewhere.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "emscripten"))'.dependencies]
i-slint-core = { git = "https://github.com/slint-ui/slint", rev = "cf3b07d4917e6759a63b0c03913a2594ec653414", version = "=1.19.0", default-features = false, features = ["image-decoders", "svg"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(slint_nightly_test)"] }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
